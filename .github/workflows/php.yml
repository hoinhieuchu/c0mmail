name: PHP and mail integration checks
on:
  push:
    branches: ["**"]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      greenmail:
        image: greenmail/standalone:2.1.3
        ports:
          - 3025:3025
          - 3143:3143
        env:
          GREENMAIL_OPTS: "-Dgreenmail.hostname=0.0.0.0 -Dgreenmail.setup.test.all -Dgreenmail.users=test:secret@example.com -Dgreenmail.users.login=email"
      mariadb:
        image: mariadb:11.4
        ports:
          - 3306:3306
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: c0mmail
          MARIADB_USER: c0m
          MARIADB_PASSWORD: secret
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: imap, pdo_mysql, openssl
      - name: Wait for GreenMail SMTP and IMAP
        run: |
          for port in 3025 3143; do
            for attempt in {1..40}; do
              if php -r '$s=@fsockopen("127.0.0.1",(int)$argv[1],$e,$m,1); if($s){fclose($s);exit(0);} exit(1);' "$port"; then break; fi
              sleep 2
            done
          done
      - name: PHP syntax check
        run: find app public bin tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Initialize MariaDB schema
        run: |
          mysql --host=127.0.0.1 --user=c0m --password=secret c0mmail < database/migrations/001_initial_schema.sql
          mysql --host=127.0.0.1 --user=c0m --password=secret c0mmail < database/migrations/002_login_rate_limits.sql
      - name: MySQL persistence and credential integration tests
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: c0mmail
          DB_USERNAME: c0m
          DB_PASSWORD: secret
        run: php tests/integration-db.php
      - name: Configure isolated HTTP smoke environment
        run: |
          printf '%s\n' 'APP_ENV=testing' 'APP_URL=http://127.0.0.1:8080' 'APP_SESSION_NAME=c0mmail_ci' 'DB_HOST=127.0.0.1' 'DB_PORT=3306' 'DB_DATABASE=c0mmail' 'DB_USERNAME=c0m' 'DB_PASSWORD=secret' 'MAIL_DOMAIN=example.test' 'MAIL_PROVIDER=manual' 'MAIL_SMTP_HOST=127.0.0.1' 'MAIL_SMTP_PORT=3025' 'MAIL_SMTP_ENCRYPTION=none' 'MAIL_IMAP_HOST=127.0.0.1' 'MAIL_IMAP_PORT=3143' 'MAIL_IMAP_ENCRYPTION=none' > .env
          printf 'APP_KEY=base64:%s\n' "$(php -r 'echo base64_encode(random_bytes(32));')" >> .env
      - name: Deployment preflight configuration check
        run: php bin/check-requirements.php
      - name: HTTP login, session and admin smoke tests
        run: bash tests/http-smoke.sh
      - name: Unit tests
        run: php tests/run.php
      - name: Real IMAP and SMTP integration tests
        env:
          MAIL_TEST_HOST: 127.0.0.1
          MAIL_TEST_IMAP_PORT: 3143
          MAIL_TEST_SMTP_PORT: 3025
          MAIL_TEST_USER: test@example.com
          MAIL_TEST_EMAIL: test@example.com
          MAIL_TEST_PASSWORD: secret
        run: php tests/integration-mail.php
