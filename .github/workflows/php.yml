name: PHP and mail integration checks
on:
  push:
    branches: ["**"]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      greenmail:
        image: greenmail/standalone:2.1.3
        ports:
          - 3025:3025
          - 3143:3143
        env:
          GREENMAIL_OPTS: "-Dgreenmail.hostname=0.0.0.0 -Dgreenmail.setup.test.all -Dgreenmail.users=test:secret@example.com -Dgreenmail.users.login=email"
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: imap, pdo_mysql, openssl
      - name: Wait for GreenMail SMTP and IMAP
        run: |
          for port in 3025 3143; do
            for attempt in {1..40}; do
              if php -r '$s=@fsockopen("127.0.0.1",(int)$argv[1],$e,$m,1); if($s){fclose($s);exit(0);} exit(1);' "$port"; then break; fi
              sleep 2
            done
          done
      - name: PHP syntax check
        run: find app public bin tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Unit tests
        run: php tests/run.php
      - name: Real IMAP and SMTP integration tests
        env:
          MAIL_TEST_HOST: 127.0.0.1
          MAIL_TEST_IMAP_PORT: 3143
          MAIL_TEST_SMTP_PORT: 3025
          MAIL_TEST_USER: test@example.com
          MAIL_TEST_EMAIL: test@example.com
          MAIL_TEST_PASSWORD: secret
        run: php tests/integration-mail.php
