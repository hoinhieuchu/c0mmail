name: PHP checks
on:
  push:
    branches: ["**"]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ["8.2", "8.3", "8.4", "8.5"]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: pdo_mysql, openssl, imap, fileinfo, dom
      - name: PHP syntax check
        run: find app public bin tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: JavaScript syntax and sync tests
        run: node --check public/assets/webmail-sync.js && node --check public/assets/webmail-compose.js && node --test tests/webmail-sync.test.js
      - name: Python fixture syntax check
        run: python3 -m py_compile tests/fixtures/starttls_smtp_server.py
      - name: Automated tests
        run: php tests/run.php
      - name: Start GreenMail TLS test server
        if: matrix.php-version == '8.5'
        run: |
          openssl req -x509 -newkey rsa:2048 -nodes \
            -keyout /tmp/greenmail-ca.key -out /tmp/greenmail-ca.crt -days 1 \
            -subj "/CN=c0mmail CI Test CA" \
            -addext "basicConstraints=critical,CA:TRUE" \
            -addext "keyUsage=critical,keyCertSign,cRLSign"
          openssl req -newkey rsa:2048 -nodes \
            -keyout /tmp/greenmail.key -out /tmp/greenmail.csr \
            -subj "/CN=localhost"
          printf "subjectAltName=DNS:localhost,IP:127.0.0.1\nextendedKeyUsage=serverAuth\nkeyUsage=critical,digitalSignature,keyEncipherment\nbasicConstraints=critical,CA:FALSE\n" > /tmp/greenmail.ext
          openssl x509 -req -in /tmp/greenmail.csr -CA /tmp/greenmail-ca.crt \
            -CAkey /tmp/greenmail-ca.key -CAcreateserial -out /tmp/greenmail.crt \
            -days 1 -sha256 -extfile /tmp/greenmail.ext
          openssl pkcs12 -export -in /tmp/greenmail.crt -inkey /tmp/greenmail.key \
            -certfile /tmp/greenmail-ca.crt -out /tmp/greenmail.p12 \
            -passout pass:changeit -name greenmail
          chmod 644 /tmp/greenmail.p12
          sudo cp /tmp/greenmail-ca.crt /usr/local/share/ca-certificates/greenmail-test-ca.crt
          sudo update-ca-certificates
          docker run -d --name greenmail \
            -p 3465:3465 -p 3993:3993 \
            -v /tmp/greenmail.p12:/home/greenmail/greenmail.p12:ro \
            -e GREENMAIL_OPTS="-Dgreenmail.setup.test.all -Dgreenmail.hostname=0.0.0.0 -Dgreenmail.users=test1:pwd1@example.com -Dgreenmail.users.login=email -Dgreenmail.tls.keystore.file=/home/greenmail/greenmail.p12 -Dgreenmail.tls.keystore.password=changeit" \
            greenmail/standalone:2.1.15
          python3 tests/fixtures/starttls_smtp_server.py \
            --port 3587 --cert /tmp/greenmail.crt --key /tmp/greenmail.key \
            --capture /tmp/c0mmail-starttls.eml --username test1@example.com --password pwd1 \
            >/tmp/starttls-smtp.log 2>&1 &
          echo $! > /tmp/starttls-smtp.pid
          python3 tests/fixtures/starttls_smtp_server.py \
            --port 3588 --cert /tmp/greenmail.crt --key /tmp/greenmail.key \
            --capture /tmp/c0mmail-reject.eml --username test1@example.com --password pwd1 \
            --final-data-reply "550 5.7.1 Rejected for test" >/tmp/reject-smtp.log 2>&1 &
          echo $! > /tmp/reject-smtp.pid
          python3 tests/fixtures/starttls_smtp_server.py \
            --port 3589 --cert /tmp/greenmail.crt --key /tmp/greenmail.key \
            --capture /tmp/c0mmail-drop.eml --username test1@example.com --password pwd1 \
            --drop-after-data >/tmp/drop-smtp.log 2>&1 &
          echo $! > /tmp/drop-smtp.pid
          ready=0
          for attempt in $(seq 1 15); do
            if timeout 3 openssl s_client -connect 127.0.0.1:3993 -servername localhost \
                -CAfile /etc/ssl/certs/ca-certificates.crt -verify_return_error -brief </dev/null >/tmp/greenmail-imaps.log 2>&1 \
              && timeout 3 openssl s_client -connect 127.0.0.1:3465 -servername localhost \
                -CAfile /etc/ssl/certs/ca-certificates.crt -verify_return_error -brief </dev/null >/tmp/greenmail-smtps.log 2>&1 \
              && printf 'QUIT\r\n' | timeout 5 openssl s_client -starttls smtp -connect 127.0.0.1:3587 -servername localhost \
                -CAfile /etc/ssl/certs/ca-certificates.crt -verify_return_error -brief >/tmp/starttls-smtp-probe.log 2>&1 \
              && printf 'QUIT\r\n' | timeout 5 openssl s_client -starttls smtp -connect 127.0.0.1:3588 -servername localhost \
                -CAfile /etc/ssl/certs/ca-certificates.crt -verify_return_error -brief >/tmp/reject-smtp-probe.log 2>&1 \
              && printf 'QUIT\r\n' | timeout 5 openssl s_client -starttls smtp -connect 127.0.0.1:3589 -servername localhost \
                -CAfile /etc/ssl/certs/ca-certificates.crt -verify_return_error -brief >/tmp/drop-smtp-probe.log 2>&1; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/greenmail-imaps.log /tmp/greenmail-smtps.log /tmp/starttls-smtp-probe.log /tmp/starttls-smtp.log /tmp/reject-smtp.log /tmp/drop-smtp.log || true
            docker logs greenmail
            exit 1
          fi
      - name: IMAP/SMTP integration tests
        if: matrix.php-version == '8.5'
        env:
          SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
          SMTP_REJECT_PORT: 3588
          SMTP_DROP_PORT: 3589
        run: php -d openssl.cafile=/etc/ssl/certs/ca-certificates.crt tests/integration-mail.php
      - name: Dump GreenMail logs on failure
        if: failure() && matrix.php-version == '8.5'
        run: |
          docker logs greenmail || true
          cat /tmp/starttls-smtp.log || true

  database-idempotency:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_ROOT_HOST: '%'
          MARIADB_DATABASE: c0mmail_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: pdo_mysql, imap, fileinfo, dom
      - name: Test clean-install migration runner
        env:
          DB_HOST: 127.0.0.1
          DB_DATABASE: c0mmail_install_test
          DB_USERNAME: root
          DB_PASSWORD: root
        run: |
          mysql -h 127.0.0.1 -uroot -proot -e "CREATE DATABASE c0mmail_install_test CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci"
          php bin/migrate.php
          php bin/migrate.php
          test "$(mysql -N -h 127.0.0.1 -uroot -proot c0mmail_install_test -e 'SELECT COUNT(*) FROM schema_migrations')" = "5"
      - name: Test production configuration preflight
        env:
          APP_ENV: production
          APP_DEBUG: "false"
          APP_URL: https://mail.example.com
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          MAIL_DOMAIN: example.com
          MAIL_SMTP_HOST: smtp.example.com
          MAIL_SMTP_PORT: "587"
          MAIL_SMTP_ENCRYPTION: starttls
          MAIL_IMAP_HOST: imap.example.com
          MAIL_IMAP_PORT: "993"
          MAIL_IMAP_ENCRYPTION: ssl
          DB_HOST: 127.0.0.1
          DB_DATABASE: c0mmail_install_test
          DB_USERNAME: root
          DB_PASSWORD: root
        run: php bin/check-environment.php
      - name: Test durable send attempts against MariaDB
        env:
          DB_HOST: 127.0.0.1
          DB_DATABASE: c0mmail_test
          DB_USERNAME: root
          DB_PASSWORD: root
        run: php tests/database-send-attempts.php
      - name: Test authenticated HTTP application flows
        env:
          DB_HOST: 127.0.0.1
          DB_DATABASE: c0mmail_http_test
          DB_USERNAME: root
          DB_PASSWORD: root
        run: |
          mysql -h 127.0.0.1 -uroot -proot -e "CREATE DATABASE c0mmail_http_test CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci"
          printf '%s\n' 'APP_ENV=testing' 'APP_URL=http://127.0.0.1:18080' 'APP_SESSION_NAME=c0mmail_ci' 'DB_HOST=127.0.0.1' 'DB_PORT=3306' 'DB_DATABASE=c0mmail_http_test' 'DB_USERNAME=root' 'DB_PASSWORD=root' 'MAIL_DOMAIN=example.test' 'MAIL_PROVIDER=manual' 'MAIL_SMTP_HOST=127.0.0.1' 'MAIL_SMTP_PORT=587' 'MAIL_SMTP_ENCRYPTION=starttls' 'MAIL_IMAP_HOST=127.0.0.1' 'MAIL_IMAP_PORT=993' 'MAIL_IMAP_ENCRYPTION=ssl' > .env
          printf 'APP_KEY=base64:%s\n' "$(php -r 'echo base64_encode(random_bytes(32));')" >> .env
          php bin/migrate.php
          php bin/create-member.php ci-member@example.test ci-member-password-123456
          bash tests/http-smoke.sh
